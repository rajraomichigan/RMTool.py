[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rmtool"
version = "1.0.0"
description = "RMTool: a random matrix and free probability calculator (Python port of the MATLAB toolbox)"
readme = "README.md"
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.9"
authors = [{name = "N. Raj Rao", email = "rajraomichigan@gmail.com"}]
keywords = ["random matrix theory", "free probability", "Stieltjes transform", "Marchenko-Pastur", "polynomial method", "sympy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.9", "numpy>=1.20"]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
test = ["pytest", "matplotlib"]

[project.urls]
Homepage = "https://github.com/rajraomichigan/rmtool"
"Original MATLAB toolbox" = "http://www.mit.edu/~raj/rmtool"
Paper = "https://arxiv.org/abs/math/0601389"

[tool.setuptools.packages.find]
include = ["rmtool*"]
